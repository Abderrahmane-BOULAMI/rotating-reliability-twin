# Rotating equipment of a process unit. Every number is an assumption, to be replaced by the site's
# maintenance history (CMMS) and costs. Time in operating hours (8 000 h per year).
hours_per_year: 8000
seed: 7

classes:
  pump:          # centrifugal process pump, bearing and seal wear-out
    weibull_beta: 1.8
    weibull_eta_h: 26000
    pf_interval_h: [1200, 0.5]        # lognormal (median, sigma): time between detectable defect and failure
    corrective_cost_keur: 18
    preventive_cost_keur: 6
    corrective_downtime_h: 36
    preventive_downtime_h: 8
  compressor:
    weibull_beta: 2.4
    weibull_eta_h: 42000
    pf_interval_h: [2000, 0.5]
    corrective_cost_keur: 120
    preventive_cost_keur: 35
    corrective_downtime_h: 120
    preventive_downtime_h: 24
  fan:           # air cooler fan, belt and bearing wear-out
    weibull_beta: 1.5
    weibull_eta_h: 30000
    pf_interval_h: [900, 0.6]
    corrective_cost_keur: 6
    preventive_cost_keur: 2
    corrective_downtime_h: 24
    preventive_downtime_h: 6

monitoring:
  route_cost_keur: 0.12              # one portable vibration measurement on one machine
  route_detection: 0.85              # probability that a route measurement catches a defect in its P-F window
  online_cost_keur_per_year: 3.0     # permanent sensor + software, per machine
  online_detection: 0.97
  planning_lead_h: 72                # time needed to plan the intervention after detection

current_practice:                    # what the unit does today in this scenario
  strategy: time_based
  interval_h: 16000

# fleet: tag, class, production loss per hour of unplanned stop (kEUR/h, 0 if spared), safety (1..4), environment (1..4)
fleet:
